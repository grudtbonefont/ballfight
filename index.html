function levelInfo(l){const boss=l%5===0;return {d:(l-1)/(NLV-1),boss,arena:l<5?0:boss?(l/5)%ARENAS.length:(l-1)%ARENAS.length,bossId:BOSSES[l/5-1],bossName:BOSSNAMES[l/5-1]};}
const BOSSK={hp:1.15,dmg:.72,size:1.45};
function botPool(d){const cap=d<.2?1:d<.5?2:d<.8?3:4;return BALLS.filter(b=>RORD.indexOf(b.rar)<=cap).map(b=>b.id);}
function botSkill(d){return .15+.75*d;}
const BOSSADJ={shackles:.72,ice:.75,dice:.75};function botMods(d,boss,ph,id){const bl=1+Math.round(d*5);const m=lvlMods(bl);const r={hp:(.75+d*.3)*m.hp*(boss?1.12:1),spd:.85+d*.15,dmg:(.75+d*.25)*m.dmg*(boss?.92:1),size:boss?1.05:1,lvl:bl};if(ph){r.hp*=BOSSK.hp*(BOSSADJ[id]||1);r.dmg*=BOSSK.dmg;r.size=BOSSK.size;}return r;}

function tourBots(n){const nm=shuffle(BOTNAMES.slice());return Array.from({length:n},(_,i)=>{const d=.2+Math.random()*.6;return {nm:nm[i%nm.length],d,ball:pickN(botPool(d),1)[0],bot:1};});}
function tourInit(P){Tour.P=P;const o=shuffle(P.map((_,i)=>i));Tour.R=[o,[],[],[]];Tour.stage=0;}
function tourPair(r){const a=Tour.R[r],out=[];for(let k=0;k<a.length;k+=2)out.push([a[k],a[k+1]]);return out;}
function tourSimOthers(r){tourPair(r).forEach(([x,y],k)=>{if(Tour.R[r+1][k]!=null)return;const A=Tour.P[x],B=Tour.P[y];if(A.me||B.me)return;const p=Math.max(.2,Math.min(.8,.5+(A.d-B.d)*.9));Tour.R[r+1][k]=Math.random()<p?x:y;});}

  this.peer.on('connection',c=>{if(this.conn){c.close();return;}this.setup(c);});
  this.peer.on('error',e=>{if(e.type==='unavailable-id'&&!fixed)this.host();else this.status('Ошибка сети: '+e.type);});});},
 join(code){code=(code||'').trim().toUpperCase();if(code.length<4){this.status('Введите код комнаты');return;}this.close();this.load(()=>{this.isHost=false;this.ended=false;this.peer=new Peer();
  this.status('Подключение к комнате '+code+'...');
  this.peer.on('open',()=>{const c=this.peer.connect('ballfight-cube-'+code,{reliable:true});this.setup(c);});
  this.peer.on('error',e=>this.status(e.type==='peer-unavailable'?'Комната не найдена':'Ошибка сети: '+e.type));});},
 setup(c){this.conn=c;this.myPick=null;this.theirPick=null;
  c.on('open',()=>{this.send({t:'hello',v:VERSION});this.status('Соединено. Проверка версии...');});
  c.on('data',d=>this.onData(d));c.on('close',()=>this.lost());c.on('error',()=>this.lost());},
 startPick(title){this.myPick=null;this.theirPick=null;closeWin('online');const p=myPanel('Ваш выбор');p.keys='A/D — выбор · Пробел — ок · R — переброс';
  showPick([p],ch=>{this.myPick={id:ch[0],lvl:save.owned[ch[0]]?save.owned[ch[0]].lvl:1};this.send({t:'pick',id:ch[0],lvl:this.myPick.lvl});pickState.wait='⏳ Ожидание выбора соперника...';drawPick();this.tryStart();},title);},
 lost(){if(this.ended)return;this.ended=true;this.close();closePick();if(mode==='game'||mode==='pick'||mode==='msg'){mode='menu';}UI.msg('Соединение потеряно','🔌 Соперник отключился или сеть недоступна.',[['В меню','UI.home()']],'⚠️');},
 send(o){try{if(this.conn&&this.conn.open)this.conn.send(o);}catch(e){}},
 onData(d){if(!d||!d.t)return;
  if(d.t==='hello'){if(d.v!==VERSION){this.status('Разные версии игры! Обновите страницу у обоих игроков.');this.send({t:'bye'});setTimeout(()=>this.close(),300);return;}this.startPick('Соперник подключён! Выберите шар');}
  else if(d.t==='bye'){this.status('Версии не совпадают. Обновите страницу.');}
  else if(d.t==='pick'){this.theirPick={id:BY[d.id]?d.id:'dash',lvl:clamp(d.lvl|0,1,10)};this.tryStart();}
  else if(d.t==='in'){this.remoteIn={x:clamp(+d.i.x||0,-1,1),y:clamp(+d.i.y||0,-1,1),a:!!d.i.a};}
  else if(d.t==='start'&&!this.isHost){closePick();newMatch('online',d.ids,{names:['Хост','Гость'],arena:d.arena|0,me:1,mods0:Object.assign(lvlMods(d.lvls[0]),{lvl:d.lvls[0]}),mods1:Object.assign(lvlMods(d.lvls[1]),{lvl:d.lvls[1]})});}
  else if(d.t==='s'&&!this.isHost&&G&&G.kind==='online'){Object.assign(G,d.s);(d.ev||[]).forEach(spawnEvent);}
  else if(d.t==='over'&&!this.isHost&&G){G.score=d.score||G.score;this.over(d.w);}
  else if(d.t==='rematch'){if(mode!=='pick')this.startPick('Реванш! Выберите шар');}},
 tryStart(){if(this.isHost&&this.myPick&&this.theirPick){const ids=[this.myPick.id,this.theirPick.id],lvls=[this.myPick.lvl,this.theirPick.lvl],arena=Math.random()*ARENAS.length|0;
  this.send({t:'start',ids,lvls,arena});closePick();newMatch('online',ids,{names:['Хост','Гость'],arena,me:0,mods0:Object.assign(lvlMods(lvls[0]),{lvl:lvls[0]}),mods1:Object.assign(lvlMods(lvls[1]),{lvl:lvls[1]})});}},
 tick(dt){if(this.isHost){this.sendT-=dt;if(this.sendT<=0){this.sendT=1/30;
   const s={balls:G.balls,clones:G.clones,fires:G.fires,proj:G.proj,zones:G.zones,beams:G.beams,score:G.score,round:G.round,phase:G.phase,timer:G.timer,banner:G.banner,bA:G.bA??1,wind:G.wind,time:G.time,dmg:G.dmg};this.send({t:'s',s,ev:G.events});G.events=[];}}
  else{const i=mergeIn(readInput(0),readInput(1));const k=JSON.stringify(i);this.sendT-=dt;if(k!==this.lastIn||this.sendT<=0){this.sendT=.1;this.lastIn=k;this.send({t:'in',i});}}},
 over(w){if(this.isHost)this.send({t:'over',w,score:G.score});G.phase='over';const win=w===G.me;save.stats.online++;if(win){save.coins+=30;save.stats.onlineWins++;}recordMatch(win,win?60:20);
  UI.msg(win?'🏆 ПОБЕДА В ОНЛАЙНЕ!':'💀 Поражение',`Счёт ${G.score[0]}:${G.score[1]}`+(win?'<br>Награда 🪙30':''),[['Реванш','Net.askRematch()'],['Выйти','Net.close();UI.home()']],win?'🏆':'💀');},
 askRematch(){if(!this.conn||!this.conn.open){UI.msg('Соперник ушёл','Соединение закрыто.',[['Меню','UI.home()']],'⚠️');return;}this.send({t:'rematch'});this.startPick('Реванш! Выберите шар');},
 close(){this.ended=true;try{this.conn&&this.conn.close();}catch(e){}try{this.peer&&this.peer.destroy();}catch(e){}this.conn=null;this.peer=null;this.remoteIn={x:0,y:0,a:false};}
};

let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;G_t+=dt;
 try{if(G&&mode==='game'&&!paused&&G.phase!=='over'){
  if(G.kind==='online'&&!Net.isHost)Net.tick(dt);
  else{let inputs;
   if(G.kind==='local')inputs=[readInput(0),readInput(1)];
   else if(G.kind==='online')inputs=[mergeIn(readInput(0),readInput(1)),Net.remoteIn];
   else if(G.multi){const pl=mergeIn(readInput(0),readInput(1));inputs=G.balls.map((b,i)=>i===G.me?pl:botInput(dt,b.sk,i,G.bs[i]));}
   else inputs=[mergeIn(readInput(0),readInput(1)),botInput(dt,G.opts.sk!=null?G.opts.sk:G.opts.d)];
   step(dt,inputs);if(G&&G.kind==='online')Net.tick(dt);else if(G)G.events=[];}}
 updFx(dt);
 if(G&&!document.getElementById('gamewin').classList.contains('hide'))render(G,G.kind==='local'?-1:G.me);}catch(e){console.error(e);}
 requestAnimationFrame(frame);}
updTray();checkAch();
if(save.daily.last!==today())setTimeout(()=>UI.daily(),400);
setTimeout(()=>{const n=featNotice();if(n&&mode!=='game')UI.msg('НОВОЕ!','Открыты новые возможности:'+n,[['Режимы','UI.modes()'],['ОК','']],'⭐');},900);

 sim(n){for(let i=0;i<n&&G&&G.phase!=='over'&&mode==='game';i++){const k=G;step(1/60,G.balls.map((b,j)=>j===G.me?botInput(1/60,.6,j,G.bs[j]):botInput(1/60,b.sk!=null?b.sk:G.opts.sk!=null?G.opts.sk:G.opts.d==null?.5:G.opts.d,j,G.bs[j])));if(G!==k)break;}}};

const Music={a:null,on:localStorage.getItem('ballfight_music')!=='0',
 init(){if(this.a)return;this.a=new Audio('music.mp3');this.a.loop=true;this.a.volume=.4;},
 play(){if(!this.on)return;this.init();const p=this.a.play();if(p&&p.catch)p.catch(()=>{});},
 toggle(){this.on=!this.on;try{localStorage.setItem('ballfight_music',this.on?'1':'0');}catch(e){}if(this.on)this.play();else if(this.a)this.a.pause();this.ui();},
 ui(){const t=document.getElementById('trm');if(t)t.textContent=this.on?'🔊':'🔇';const m=document.getElementById('smmus');if(m)m.lastChild.textContent='Музыка: '+(this.on?'вкл':'выкл');}};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,function f(){Music.play();removeEventListener('pointerdown',f);removeEventListener('keydown',f);},{once:true}));
Music.ui();

const Cloud={api:'https://ballfight-api.onrender.com',auth:null,epoch:+(localStorage.getItem('bf_epoch')||0),epochOk:false,
 applyEpoch(e){e=e|0;if(e>this.epoch){const had=localStorage.getItem(SAVE_KEY)!==null;['ballfight_save_v1','bf_rw','bf_snake','bf_replay'].forEach(k=>{try{localStorage.removeItem(k);}catch(x){}});
   save=defSave();save._t=0;save._epoch=e;try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(x){}if(typeof updTray==='function')updTray();
   if(had&&typeof toast==='function')toast('🔄 Сброс прогресса','Прогресс всех игроков обнулён. Начинаем заново!');}
  this.epoch=Math.max(this.epoch,e);try{localStorage.setItem('bf_epoch',String(this.epoch));}catch(x){}save._epoch=this.epoch;this.epochOk=true;},
 async checkEpoch(){try{const j=await this.req('/api/epoch');this.applyEpoch(j.epoch);}catch(e){}return this.epochOk;},state:'off',msg:'',timer:0,busy:false,last:null,
 load(){try{this.auth=JSON.parse(localStorage.getItem('ballfight_auth'))||null;}catch(e){this.auth=null;}},
 store(){try{if(this.auth)localStorage.setItem('ballfight_auth',JSON.stringify(this.auth));else localStorage.removeItem('ballfight_auth');}catch(e){}},
 async req(path,method,body,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||75000);
  const slow=setTimeout(()=>this.set('wake','Сервер просыпается… (бесплатный хостинг, до ~60 с)'),2500);
  try{const r=await fetch(this.api+path,{method:method||'GET',signal:c.signal,headers:Object.assign({'Content-Type':'application/json'},this.auth?{Authorization:'Bearer '+this.auth.token}:{}),body:body?JSON.stringify(body):undefined});
   let j={};try{j=await r.json();}catch(e){}if(r.status===401&&this.auth&&path!=='/api/login'){this.auth=null;this.store();}
   if(!r.ok)throw Object.assign(new Error(j.error||('Ошибка '+r.status)),{status:r.status,data:j});return j;}
  catch(e){if(e.name==='AbortError')throw new Error('Сервер не отвечает. Попробуйте позже.');if(e instanceof TypeError)throw new Error('Нет связи с сервером');throw e;}
  finally{clearTimeout(t);clearTimeout(slow);}},
 set(st,msg){this.state=st;this.msg=msg||'';this.ui();},
 ui(){const t=document.getElementById('tra');if(t){t.textContent=this.auth?(this.state==='wake'||this.state==='sync'?'⏳ ':this.state==='err'?'⚠️ ':'☁️ ')+this.auth.nick:'👤 Гость';t.title=this.msg||'Аккаунт';}
  const m=document.getElementById('accst');if(m)m.textContent=this.msg;},
 summary(s){return s?`ур. игрока ${s.plvl||1}, 🪙${s.coins||0}, шаров ${Object.keys(s.owned||{}).length}, уровней ${Math.min(60,Math.max(0,(s.unlocked||1)-1))}/60`:'—';},
 adopt(cs){save=migrate(cs);try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}updTray();},
 queue(){if(!this.auth||this.applying)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),3000);},
 async push(){if(!this.auth)return;if(!this.epochOk&&!await this.checkEpoch()){this.set('err','Облако недоступно');return;}save._epoch=this.epoch;if(this.busy){this.queue();return;}this.busy=true;this.set('sync','Сохранение в облако…');
  try{const j=await this.req('/api/save','PUT',{save});this.last=new Date(j.updated);this.set('ok','Сохранено в облаке '+this.last.toLocaleTimeString('ru-RU'));}
  catch(e){if(e.status===409&&e.data&&e.data.error==='epoch'){this.applyEpoch(e.data.epoch);this.busy=false;return this.push();}this.set('err','Облако: '+e.message);}finally{this.busy=false;}},
 async afterLogin(j){this.auth={token:j.token,nick:j.nick};this.store();if(j.epoch!=null)this.applyEpoch(j.epoch);
  const cs=j.save,hasLocal=(save.stats&&save.stats.matches>0)||ownedIds().length>3||save.coins!==100;
  if(!cs){await this.push();toast('☁️ Вход выполнен','Прогресс этого устройства сохранён в облако');UI.account();return;}
  if(!hasLocal||JSON.stringify(Object.assign({},cs,{_t:0}))===JSON.stringify(Object.assign({},save,{_t:0}))){this.adopt(cs);this.set('ok','Загружено из облака');toast('☁️ Вход выполнен','Прогресс загружен из облака');UI.account();return;}
  openWin('accpick','Какое сохранение использовать?',`<div class="inset" style="font-size:13px">В облаке и на этом устройстве разные сохранения. Выберите одно — второе будет заменено.<br><br>
   <b>☁️ Облако:</b> ${this.summary(cs)}<br><b>💻 Это устройство:</b> ${this.summary(save)}</div>
   <div style="text-align:center;margin-top:10px"><button onclick="Cloud.choose(1)">☁️ Взять из облака</button> <button onclick="Cloud.choose(0)">💻 Оставить это устройство</button></div>`,{w:460,icon:'☁️',modal:1});
  this.pending=cs;},
 choose(c){closeWin('accpick');if(c)this.adopt(this.pending);else this.push();this.pending=null;this.set('ok',c?'Загружено из облака':'Сохранение устройства отправлено в облако');UI.account();},
 async go(kind){const nick=document.getElementById('accn').value.trim(),pass=document.getElementById('accp').value;
  document.querySelectorAll('#w_account button').forEach(b=>b.disabled=true);this.set('sync','Подключение…');
  try{const j=await this.req('/api/'+kind,'POST',{nick,pass});await this.afterLogin(j);}
  catch(e){this.set('err',e.message);}finally{document.querySelectorAll('#w_account button').forEach(b=>b.disabled=false);}},
 async logout(){try{await this.req('/api/logout','POST',{},10000);}catch(e){}this.auth=null;this.store();this.set('off','');UI.account();toast('Вы вышли','Игра продолжается в гостевом режиме');},
 async startup(){this.load();this.ui();const ok=await this.checkEpoch();if(!this.auth)return;if(!ok){this.set('err','Облако недоступно');return;}this.set('sync','Синхронизация…');
  try{const j=await this.req('/api/save');if(j.epoch!=null)this.applyEpoch(j.epoch);const cs=j.save;
   if(cs&&(cs._t||0)>(save._t||0)){this.applying=true;this.adopt(cs);this.applying=false;this.set('ok','Загружено из облака');}
   else if(!cs||(save._t||0)>(cs._t||0))await this.push();else this.set('ok','Синхронизировано');}
  catch(e){this.set(this.auth?'err':'off',this.auth?'Облако: '+e.message:'Сессия истекла — войдите снова');}}};
UI.account=function(){const a=Cloud.auth;
 openWin('account','Аккаунт',a?`<div class="inset" style="font-size:13px">Вы вошли как <b>${a.nick.replace(/[<>&]/g,'')}</b>.<br>Прогресс автоматически сохраняется в облако после матчей и покупок и доступен на любом устройстве.<br><br>Текущий прогресс: ${Cloud.summary(save)}</div>
  <div id="accst" class="hint" style="margin:8px 0;min-height:16px"></div><div style="text-align:center"><button onclick="Cloud.push()">☁️ Сохранить сейчас</button> <button onclick="Cloud.logout()">Выйти</button></div>`
 :`<div class="inset" style="font-size:13px">Войдите, чтобы прогресс синхронизировался между устройствами. Без входа игра работает в гостевом режиме (сохранение только в этом браузере).</div>
  <table style="margin:10px auto;font-size:13px"><tr><td>Ник:</td><td><input id="accn" maxlength="16" autocomplete="username" style="width:180px"></td></tr><tr><td>Пароль:</td><td><input id="accp" type="password" maxlength="72" autocomplete="current-password" style="width:180px" onkeydown="if(event.key==='Enter')Cloud.go('login')"></td></tr></table>
  <div id="accst" class="hint" style="margin:4px 0 8px;min-height:16px;text-align:center"></div>
  <div style="text-align:center"><button onclick="Cloud.go('login')">🔑 Войти</button> <button onclick="Cloud.go('register')">📝 Регистрация</button> <button onclick="closeWin('account')">Гость</button></div>
  <p class="hint" style="font-size:11px">Ник 3–16 символов, пароль от 6 символов. Первый вход может занять до минуты — бесплатный сервер просыпается.</p>`,{w:440,icon:'👤'});Cloud.ui();};
