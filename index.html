const BUMP=[{x:400,y:400,r:42},{x:170,y:170,r:28},{x:630,y:630,r:28},{x:630,y:170,r:28},{x:170,y:630,r:28}];

 common:{n:'Обычный ящик',price:120,cur:'c',ico:'📦',w:{common:70,rare:25,epic:4.5,legendary:.5,mythic:0}},
 rare:{n:'Редкий ящик',price:400,cur:'c',ico:'🎁',w:{common:25,rare:55,epic:16,legendary:3.5,mythic:.5}},
 epic:{n:'Эпический ящик',price:1000,cur:'c',ico:'💼',w:{common:0,rare:45,epic:40,legendary:12,mythic:3}},
 gem:{n:'Кристальный ящик',price:30,cur:'g',ico:'💎',w:{common:0,rare:0,epic:55,legendary:35,mythic:10}},

 stats:{matches:0,wins:0,losses:0,rounds:0,dmg:0,crates:0,bosses:0,survBest:0,tourWins:0,online:0,onlineWins:0,local:0,abil:0,upgrades:0},ach:{},daily:{last:'',streak:0}};}
let save=defSave();
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)save=migrate(s);}catch(e){}
function migrate(s){const d=defSave();
 if(Array.isArray(s.owned)){const o={};s.owned.forEach(id=>{if(BY[id])o[id]={lvl:1,cards:0}});d.coins=s.coins||0;d.owned=Object.keys(o).length?o:d.owned;d.unlocked=s.unlocked||1;d.stats.wins=s.wins||0;return d;}
 const r=Object.assign(d,s);r.stats=Object.assign(defSave().stats,s.stats||{});r.daily=Object.assign({last:'',streak:0},s.daily||{});r.ach=s.ach||{};
 for(const k in r.owned)if(!BY[k])delete r.owned[k];r.v=2;return r;}
function persist(){save._t=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}updTray();if(typeof Cloud!=='undefined')Cloud.queue();}
const ownedIds=()=>Object.keys(save.owned);
function lvlMods(l){l=l||1;return {hp:1+.08*(l-1),dmg:1+.06*(l-1)};}

const keys={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code)&&mode!=='menu')e.preventDefault();onKey(e.code);});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function readInput(set){const k=set===0?{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',a:'Space'}:{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',a:'Enter'};
 return {x:(keys[k.r]?1:0)-(keys[k.l]?1:0),y:(keys[k.d]?1:0)-(keys[k.u]?1:0),a:!!keys[k.a]};}
function mergeIn(a,b){return {x:Math.max(-1,Math.min(1,a.x+b.x)),y:Math.max(-1,Math.min(1,a.y+b.y)),a:a.a||b.a};}
// ===================== УТИЛИТЫ =====================
const W=800,H=800,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function pickN(pool,n){const p=shuffle([...new Set(pool)]);if(p.length<n)shuffle(BALLS.map(b=>b.id).filter(i=>!p.includes(i))).forEach(i=>p.push(i));return p.slice(0,n);}
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.round(clamp(f<0?v*(1+f):v+(255-v)*f,0,255));return `rgb(${m(r)},${m(g)},${m(b)})`;}
function today(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function seeded(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296;};}

function makeBall(id,side,mods){const d=BY[id];mods=mods||{};const hp=Math.round(d.hp*HPK*(mods.hp||1));const r=34*(mods.size||1);

function dragify(w){const tb=w.querySelector('.tb');tb.addEventListener('mousedown',e=>{if(e.target.tagName==='BUTTON')return;const sx=e.clientX-w.offsetLeft,sy=e.clientY-w.offsetTop;
 const mv=ev=>{w.style.left=clamp(ev.clientX-sx,-w.offsetWidth+60,innerWidth-60)+'px';w.style.top=clamp(ev.clientY-sy,0,innerHeight-60)+'px';};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);});}
function updTasks(){const t=document.getElementById('tasks');const ws=[...document.querySelectorAll('.win:not(.hide)')];const act=ws.filter(w=>!w.classList.contains('mini')).sort((a,b)=>(+b.style.zIndex||0)-(+a.style.zIndex||0))[0];
 t.innerHTML='';ws.forEach(w=>{const b=document.createElement('button');b.textContent=(w.id==='gamewin'?'🎮 Куб-Арена':(w.dataset.icon+' '+w.dataset.title));if(w===act&&!w.classList.contains('inactive'))b.className='act';b.onclick=()=>{if(w.id==='gamewin'){front(w);return;}if(w.classList.contains('mini')){w.classList.remove('mini');front(w);}else if(w===act)minWin(w.id.slice(2));else front(w);};t.appendChild(b);});}

 ui(){const t=document.getElementById('tra');if(t){t.textContent=this.auth?(this.state==='wake'||this.state==='sync'?'⏳ ':this.state==='err'?'⚠️ ':'☁️ ')+this.auth.nick:'👤 Гость';t.title=this.msg||'Аккаунт';}
  const m=document.getElementById('accst');if(m)m.textContent=this.msg;},
 summary(s){return s?`ур. игрока ${s.plvl||1}, 🪙${s.coins||0}, шаров ${Object.keys(s.owned||{}).length}, уровней ${Math.max(0,(s.unlocked||1)-1)}/30`:'—';},
 adopt(cs){save=migrate(cs);try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}updTray();},
 queue(){if(!this.auth||this.applying)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),3000);},
 async push(){if(!this.auth)return;if(this.busy){this.queue();return;}this.busy=true;this.set('sync','Сохранение в облако…');
  try{const j=await this.req('/api/save','PUT',{save});this.last=new Date(j.updated);this.set('ok','Сохранено в облаке '+this.last.toLocaleTimeString('ru-RU'));}
  catch(e){this.set('err','Облако: '+e.message);}finally{this.busy=false;}},
 async afterLogin(j){this.auth={token:j.token,nick:j.nick};this.store();
  const cs=j.save,hasLocal=(save.stats&&save.stats.matches>0)||ownedIds().length>3||save.coins!==100;
  if(!cs){await this.push();toast('☁️ Вход выполнен','Прогресс этого устройства сохранён в облако');UI.account();return;}
  if(!hasLocal||JSON.stringify(Object.assign({},cs,{_t:0}))===JSON.stringify(Object.assign({},save,{_t:0}))){this.adopt(cs);this.set('ok','Загружено из облака');toast('☁️ Вход выполнен','Прогресс загружен из облака');UI.account();return;}
  openWin('accpick','Какое сохранение использовать?',`<div class="inset" style="font-size:13px">В облаке и на этом устройстве разные сохранения. Выберите одно — второе будет заменено.<br><br>
   <b>☁️ Облако:</b> ${this.summary(cs)}<br><b>💻 Это устройство:</b> ${this.summary(save)}</div>
   <div style="text-align:center;margin-top:10px"><button onclick="Cloud.choose(1)">☁️ Взять из облака</button> <button onclick="Cloud.choose(0)">💻 Оставить это устройство</button></div>`,{w:460,icon:'☁️',modal:1});
  this.pending=cs;},
 choose(c){closeWin('accpick');if(c)this.adopt(this.pending);else this.push();this.pending=null;this.set('ok',c?'Загружено из облака':'Сохранение устройства отправлено в облако');UI.account();},
 async go(kind){const nick=document.getElementById('accn').value.trim(),pass=document.getElementById('accp').value;
  document.querySelectorAll('#w_account button').forEach(b=>b.disabled=true);this.set('sync','Подключение…');
  try{const j=await this.req('/api/'+kind,'POST',{nick,pass});await this.afterLogin(j);}
  catch(e){this.set('err',e.message);}finally{document.querySelectorAll('#w_account button').forEach(b=>b.disabled=false);}},
 async logout(){try{await this.req('/api/logout','POST',{},10000);}catch(e){}this.auth=null;this.store();this.set('off','');UI.account();toast('Вы вышли','Игра продолжается в гостевом режиме');},
 async startup(){this.load();this.ui();if(!this.auth)return;this.set('sync','Синхронизация…');
  try{const j=await this.req('/api/save');const cs=j.save;
   if(cs&&(cs._t||0)>(save._t||0)){this.applying=true;this.adopt(cs);this.applying=false;this.set('ok','Загружено из облака');}
   else if(!cs||(save._t||0)>(cs._t||0))await this.push();else this.set('ok','Синхронизировано');}
  catch(e){this.set(this.auth?'err':'off',this.auth?'Облако: '+e.message:'Сессия истекла — войдите снова');}}};
UI.account=function(){const a=Cloud.auth;
 openWin('account','Аккаунт',a?`<div class="inset" style="font-size:13px">Вы вошли как <b>${a.nick.replace(/[<>&]/g,'')}</b>.<br>Прогресс автоматически сохраняется в облако после матчей и покупок и доступен на любом устройстве.<br><br>Текущий прогресс: ${Cloud.summary(save)}</div>
  <div id="accst" class="hint" style="margin:8px 0;min-height:16px"></div><div style="text-align:center"><button onclick="Cloud.push()">☁️ Сохранить сейчас</button> <button onclick="Cloud.logout()">Выйти</button></div>`
 :`<div class="inset" style="font-size:13px">Войдите, чтобы прогресс синхронизировался между устройствами. Без входа игра работает в гостевом режиме (сохранение только в этом браузере).</div>
  <table style="margin:10px auto;font-size:13px"><tr><td>Ник:</td><td><input id="accn" maxlength="16" autocomplete="username" style="width:180px"></td></tr><tr><td>Пароль:</td><td><input id="accp" type="password" maxlength="72" autocomplete="current-password" style="width:180px" onkeydown="if(event.key==='Enter')Cloud.go('login')"></td></tr></table>
  <div id="accst" class="hint" style="margin:4px 0 8px;min-height:16px;text-align:center"></div>
  <div style="text-align:center"><button onclick="Cloud.go('login')">🔑 Войти</button> <button onclick="Cloud.go('register')">📝 Регистрация</button> <button onclick="closeWin('account')">Гость</button></div>
  <p class="hint" style="font-size:11px">Ник 3–16 символов, пароль от 6 символов. Первый вход может занять до минуты — бесплатный сервер просыпается.</p>`,{w:440,icon:'👤'});Cloud.ui();};
Cloud.startup();
</script>
